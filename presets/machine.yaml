juju:
  # The default 20-minute bootstrap timeout is too short for the LXD
  # controller on slow CI runners (issue #70); pin a longer one so the
  # preset works out of the box on busy GHA hosts.
  extra-bootstrap-args: --config bootstrap-timeout=1800
  model-defaults:
    test-mode: "true"
    automatically-retry-hooks: "false"

providers:
  lxd:
    enable: true
    bootstrap: true

host:
  packages:
    - gnome-keyring
    - python3-pip
    - python3-venv
  snaps:
    charmcraft:
    jq:
    yq:
    snapcraft:
