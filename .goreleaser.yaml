version: 2
project_name: concierge
before:
  hooks:
    - go mod tidy
builds:
  - main: .
    binary: concierge
    mod_timestamp: "{{ .CommitTimestamp }}"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - ppc64le
      - s390x
      - "386"
      - arm
      - riscv64
    goarm:
      - "7"
    ldflags:
      - -X github.com/canonical/concierge/cmd.version={{ .Version }} -X github.com/canonical/concierge/cmd.commit={{ .Commit }}

snapcrafts:
  - name: concierge
    publish: true
    license: Apache-2.0
    base: core24
    confinement: classic
    grade: stable
    # goreleaser can't see which branch a tag was cut from (a tag checkout is a
    # detached HEAD), so route by version instead: 1.5.x goes to its own track
    # rather than clobbering latest/stable with an older release.
    channel_templates:
      - "{{ if and (eq .Major 1) (eq .Minor 5) }}1.5{{ else }}latest{{ end }}/edge"
      - "{{ if and (eq .Major 1) (eq .Minor 5) }}1.5{{ else }}latest{{ end }}/beta"
      - "{{ if and (eq .Major 1) (eq .Minor 5) }}1.5{{ else }}latest{{ end }}/candidate"
      - "{{ if and (eq .Major 1) (eq .Minor 5) }}1.5{{ else }}latest{{ end }}/stable"
    summary: A utility for configuring dev/test machines for charm development
    description: |
      concierge is an opinionated utility for provisioning charm development and testing machines.

      Its role is to ensure that a given machine has the relevant "craft" tools and providers
      installed, then bootstrap a Juju controller onto each of the providers. Additionally, it can
      install selected tools from the Snap Store or the Ubuntu archive.

      Configuration is by flags/environment variables, or by configuration file. The configuration file
      must be in the current working directory and named 'concierge.yaml', or the path specified using
      the '-c' flag.

      Several presets are available by default to cover common charm development and testing scenarios.

      Some aspects of presets and config files can be overridden using flags such as '--juju-channel'.
      Each of the override flags has an environment variable equivalent, such as
      'CONCIERGE_JUJU_CHANNEL'.

      More information at https://canonical.com/juju/docs/concierge/.
    extra_files:
      - source: .github/concierge.png
        destination: concierge.png
        mode: 0644
      - source: presets/crafts.yaml
        destination: presets/crafts.yaml
        mode: 0644
      - source: presets/dev.yaml
        destination: presets/dev.yaml
        mode: 0644
      - source: presets/k8s.yaml
        destination: presets/k8s.yaml
        mode: 0644
      - source: presets/machine.yaml
        destination: presets/machine.yaml
        mode: 0644
      - source: presets/microk8s.yaml
        destination: presets/microk8s.yaml
        mode: 0644

checksum:
  name_template: "checksums.txt"
snapshot:
  version_template: "{{ incpatch .Version }}-next"
release:
  prerelease: auto
  # Defaults to empty.
  footer: |
    ## Thanks!

    That's all the changes for {{ .Tag }}!
changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^test:"
      - "^ci:"
